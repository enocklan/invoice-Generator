
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Gen | Dashboard</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="#" class="brand">Invoice Gen</a>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">Invoices</a>
        <a href="#" class="nav-link">Clients</a>
        <a href="#" class="nav-link">Settings</a>
      </nav>

      <div class="sidebar-footer">
        <p>Help &amp; resources</p>
        <div class="user-profile">
          <div class="user-avatar">AC</div>
          <div>
            <p class="user-name">Alex Carter</p>
            <p class="user-role">Personal workspace</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main workspace -->
    
    <main class="main-content">
      <!-- Header -->
      <header class="top-header">
        <div>
          <p class="workspace-label">Personal workspace</p>
          <h1>Home</h1>
        </div>

        <button class="new-invoice-btn" type="button">
          + New invoice
        </button>
      </header>

      <!-- Dashboard content -->
      <section class="dashboard-content">
        <div class="section-heading">
          <div>
            <h2>Overview</h2>
            <p>Track your invoices and payments.</p>
          </div>
        </div>

        <!-- Summary cards -->
        <div class="summary-cards">
          <article class="summary-card">
            <p class="card-label">Outstanding</p>
            <h3>KES 45,000</h3>
            <p class="card-description">Awaiting payment</p>
          </article>

          <article class="summary-card">
            <p class="card-label">Overdue</p>
            <h3>KES 12,000</h3>
            <p class="card-description">Past the due date</p>
          </article>

          <article class="summary-card">
            <p class="card-label">Paid in October</p>
            <h3>KES 86,500</h3>
            <p class="card-description">Successfully paid</p>
          </article>
        </div>
      </section>
    </main>


  <script type="module" src="./js/main.js"></script>
</body>
</html>
