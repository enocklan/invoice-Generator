
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Gen | Dashboard</title>

<link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="#" class="brand">Invoice Gen</a>

     
<nav class="sidebar-nav" aria-label="Main navigation">
  <a href="#" class="nav-link active">
    <i class="fa-solid fa-house" aria-hidden="true"></i>
    <span>Home</span>
  </a>

  <a href="#" class="nav-link">
    <i class="fa-solid fa-file-invoice" aria-hidden="true"></i>
    <span>Invoices</span>
  </a>

  <a href="#" class="nav-link">
    <i class="fa-solid fa-users" aria-hidden="true"></i>
    <span>Clients</span>
  </a>

  <a href="#" class="nav-link">
    <i class="fa-solid fa-gear" aria-hidden="true"></i>
    <span>Settings</span>
  </a>
</nav>


      <div class="sidebar-footer">
        <p>Help &amp; resources</p>
        <div class="user-profile">
          <div class="user-avatar">AC</div>
          <div>
            <p class="user-name">Alex Carter</p>
            <p class="user-role">Personal workspace</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main workspace -->
    
    <main class="main-content">
      <!-- Header -->
      <header class="top-header">
        <div>
          <p class="workspace-label">Personal workspace</p>
          <h1>Home</h1>
        </div>

        <button class="new-invoice-btn" type="button">
          + New invoice
        </button>
      </header>

      <!-- Dashboard content -->
      <section class="dashboard-content">
        <div class="section-heading">
          <div>
            <h2>Overview</h2>
            <p>Track your invoices and payments.</p>
          </div>
        </div>

        <!-- Summary cards -->
       
<div class="summary-cards">
  <article class="summary-card">
    <div class="card-top">
      <p class="card-label">Outstanding</p>
      <label class="currency-control">
        <span>Currency</span>
        <select class="home-currency" aria-label="Outstanding card currency">
          <option value="KES" selected>KSH (KES)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="AUD">AUD (A$)</option>
        </select>
      </label>
    </div>
    <h3 class="card-amount" data-amount="45000">KSh 45,000</h3>
    <p class="card-description">Awaiting payment</p>
  </article>

  <article class="summary-card">
    <div class="card-top">
      <p class="card-label">Overdue</p>
      <label class="currency-control">
        <span>Currency</span>
        <select class="home-currency" aria-label="Overdue card currency">
          <option value="KES" selected>KSH (KES)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="AUD">AUD (A$)</option>
        </select>
      </label>
    </div>
    <h3 class="card-amount" data-amount="12000">KSh 12,000</h3>
    <p class="card-description">Past the due date</p>
  </article>

  <article class="summary-card">
    <div class="card-top">
      <p class="card-label">Paid in October</p>
      <label class="currency-control">
        <span>Currency</span>
        <select class="home-currency" aria-label="Paid in October card currency">
          <option value="KES" selected>KSH (KES)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="AUD">AUD (A$)</option>
        </select>
      </label>
    </div>
    <h3 class="card-amount" data-amount="86500">KSh 86,500</h3>
    <p class="card-description">Successfully paid</p>
  </article>
</div>

      </section>
    </main>


  <script type="module" src="./js/main.js"></script>
</body>
</html>
