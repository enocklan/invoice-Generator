
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Gen | Dashboard</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="#" class="brand">Invoice Gen</a>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">Invoices</a>
        <a href="#" class="nav-link">Clients</a>
        <a href="#" class="nav-link">Settings</a>
      </nav>

      <div class="sidebar-footer">
        <p>Help &amp; resources</p>
        <div class="user-profile">
          <div class="user-avatar">AC</div>
          <div>
            <p class="user-name">Alex Carter</p>
            <p class="user-role">Personal workspace</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main workspace -->
    <main class="main-content">

      <!-- Header -->
      <header class="top-header">
        <div>
          <p class="workspace-label">Personal workspace</p>
          <h1>Home</h1>
        </div>

        <button class="new-invoice-btn" type="button">
          + New invoice
        </button>
      </header>

    </main>

  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
